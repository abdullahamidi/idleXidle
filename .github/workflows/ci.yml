name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings are errors. This project has already shipped two bugs that a compiler
      # warning would have caught, and a warning nobody reads is not a warning.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The unit suite is headless by design (ADR-001): all game logic lives in
      # IdleXIdle.Core, which has ZERO MonoGame references, so the balance math runs
      # without a window or a GL context. That is the whole reason it is testable in CI.
      - name: Unit tests
        run: dotnet test tests/unit/IdleXIdle.Core.Tests --no-build --configuration Release --verbosity normal

      # BRAND's curse guards (ADR-013 §7). They live in the Game test project, which the
      # unit step above does not run, and they need no window or GL context: they read the
      # committed shader binary's source hash, the baked .brand.json host data against a
      # fresh bake, the no-read-back source scan, the zero-allocation composition and the
      # prototype-is-gone pins. Without this step an edited BrandCurse.fx that was never
      # rebuilt (tools/shaders/build_shaders.sh, Windows only) shipped with a green CI.
      - name: BRAND curse guards
        run: >-
          dotnet test tests/unit/IdleXIdle.Game.Tests --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~brand_curse_shader_test|FullyQualifiedName~brand_host_bake_test|FullyQualifiedName~brand_curse_presentation_test|FullyQualifiedName~brand_curse_test|FullyQualifiedName~brand_mark_test"

      # Unit tests prove each system is internally correct. They cannot prove the systems FIT.
      # The two worst bugs in this project were both integration failures that every unit test
      # happily passed.
      - name: Integration tests
        run: dotnet test tests/integration/IdleXIdle.Integration.Tests --no-build --configuration Release --verbosity normal
