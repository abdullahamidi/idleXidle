  # ─── Added 2026-07-14 by the W16 registry-consolidation pass ───
  # BALANCE-CRITICAL cross-system constants. Several of these were quoted as bare
  # literals in 3-5 GDDs each with no owner — exactly the drift the registry exists
  # to prevent.

  - name: active_efficiency_cap_percent
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
      - design/gdd/region-mastery-automation-system.md
      - design/gdd/loot-drop-system.md
    value: 300
    unit: "percent (HARD-LOCKED — do not raise without a pillar-level decision)"
    notes: "Direct implementation of the user's 'avoid sustained active play being more
      than roughly 3x better'. Against the optimized-idle ceiling (120%) this is 2.5x."
    added: 2026-07-14
    revised: ""

  - name: telegraph_windup_floor_ms
    status: active
    source: design/gdd/creature-ai-telegraph-system.md
    referenced_by:
      - design/gdd/creature-ai-telegraph-system.md
      - design/gdd/combat-encounter-system.md
      - design/gdd/combat-hud.md
      - design/gdd/accessibility-settings-system.md
      - design/gdd/vow-condition-tracking.md
    value: 600
    unit: "milliseconds (floor — clamps at EVERY difficulty tier)"
    notes: "Derived from WCAG 2.3.1 anti-strobe math (max 3 flashes/sec) plus Hick's Law.
      ONE anti-strobe constant for the whole game, deliberately — the Vow HUD's
      Schmitt-trigger dead-band reuses this exact value rather than defining a second one
      that could silently drift out of sync."
    added: 2026-07-14
    revised: ""

  - name: basic_attack_interval_ms
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
      - design/gdd/combat-hud.md
      - design/gdd/onboarding-tutorial-system.md
    value: 1200
    unit: "milliseconds (safe range 800-2000)"
    notes: "The hard DPS-cap floor. Basic attacks auto-fire on this timer; CLICKING STEERS
      THE NEXT TICK'S TARGET AND NEVER ADDS AN ATTACK. This is what gives the game clicker
      tactility without becoming an APM test — DPS is mathematically independent of click
      rate, which Pillar 1 (Precision Over Reflexes) requires."
    added: 2026-07-14
    revised: ""

  - name: region_auto_sell_gleam_cap_per_hour
    status: active
    source: design/gdd/region-mastery-automation-system.md
    referenced_by:
      - design/gdd/region-mastery-automation-system.md
      - design/gdd/loot-drop-system.md
      - design/gdd/the-forge-system.md
      - design/gdd/hunter-progression-system.md
    value: 24
    unit: "gleam per hour (HARD CAP — economic integrity)"
    notes: "Defuses the Stage-3 inflation bomb. Without it, loot-drop-system's own faucet
      model projected ~760,000 Gleam from a 100-hour unattended session (~3,800 Vow
      bindings); with it, 2,400. Do not raise without re-running the sink math in
      hunter-progression-system."
    added: 2026-07-14
    revised: ""

  - name: tier_attack_scalar
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
      - design/gdd/encounter-spawn-system.md
    value: 0.15
    unit: "scalar (float, safe range 0.05-0.50)"
    notes: "Incoming-damage scaling per power_tier (Formula 3b Step 1). Deliberately
      IDENTICAL to tier_defense_scalar, tier_health_scalar and tier_break_scalar — four
      curves, one scalar, so tier difficulty scales coherently rather than compounding."
    added: 2026-07-14
    revised: ""

  - name: tier_defense_scalar
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
    value: 0.15
    unit: "scalar (float, safe range 0.05-0.50)"
    added: 2026-07-14
    revised: ""

  - name: block_damage_reduction_percent
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
      - design/gdd/creature-ai-telegraph-system.md
      - design/gdd/combat-hud.md
    value: 0.80
    unit: "fraction (float, safe range 0.50-0.95)"
    notes: "Block reduces but NEVER negates. Full negation would make block strictly
      dominate dodge (no charge cost, no cooldown), collapsing the defensive triad to a
      single verb. Applied at Formula 3b Step 3. Preserves the locked reward gradient
      interrupt > dodge > block."
    added: 2026-07-14
    revised: ""

  - name: min_incoming_damage_floor
    status: active
    source: design/gdd/combat-encounter-system.md
    referenced_by:
      - design/gdd/combat-encounter-system.md
    value: 1
    unit: "hit points (int — STRUCTURAL, do not set to 0)"
    notes: "An unavoided hit always costs SOMETHING, however much defense is stacked.
      This is the backstop that stops defense from ever becoming immunity — which would
      make telegraphs ignorable and flatten Pillar 1. Not a feel knob."
    added: 2026-07-14
    revised: ""

  - name: hunter_defense_cap
    status: active
    source: design/gdd/hunter-progression-system.md
    referenced_by:
      - design/gdd/hunter-progression-system.md
      - design/gdd/combat-encounter-system.md
      - design/gdd/resonance-weaving-system.md
    value: 120
    unit: "defense points (base 0, +2 per Training rank, 60 ranks max)"
    notes: "NOTE THE BASE VALUE IS 0. This is why vow_fragility could not be priced as a
      percentage of defense — 20% of 0 is 0, so any player who simply never trained defense
      would have paid nothing. At the 120 cap the player still takes 45.5% of incoming
      damage (100/(100+120)); the last 20 points buy only 4.5 percentage points versus 16.7
      for the first 20."
    added: 2026-07-14
    revised: ""

  - name: static_cost_conversion_rate
    status: active
    source: design/gdd/resonance-weaving-system.md
    referenced_by:
      - design/gdd/resonance-weaving-system.md
    value: 3.0
    unit: "power per unit of effective-HP sacrificed (float, safe range 1.5-5.0)"
    notes: "All static-cost Vows must lie on this one line, so that none dominates."
    added: 2026-07-14
    revised: ""

  - name: fragility_damage_taken_increase
    status: active
    source: design/gdd/resonance-weaving-system.md
    referenced_by:
      - design/gdd/resonance-weaving-system.md
      - design/gdd/combat-encounter-system.md
    value: 0.125
    unit: "fraction of final_damage, added post-mitigation (Formula 3b Step 5)"
    notes: "vow_fragility's price. It is applied to the damage pipeline's OUTPUT rather
      than as a reduction of the `defense` stat, and that placement is load-bearing: this
      Vow has been accidentally FREE twice. (1) Originally `defense` was read by no formula
      at all (Blocker B3), so '-20% defense' cost nothing — +60% ability power gratis.
      (2) Once Formula 3b made defense live, '-20% of defense' STILL cost nothing to any
      player who never trained defense, since the stat's base is 0. A cost expressed as a
      fraction of an investable stat is always avoidable by declining the investment. You
      cannot, however, decline to take damage. Costs 0.111 eHP -> multiplier 1.33
      (was incorrectly 1.60)."
    added: 2026-07-14
    revised: ""

  - name: efficiency_quantity_scalar
    status: active
    source: design/gdd/loot-drop-system.md
    referenced_by:
      - design/gdd/loot-drop-system.md
    value: 0.8
    unit: "scalar (float, safe range 0.3-1.2) — BALANCE-CRITICAL"
    notes: "How strongly active_efficiency_percent raises drop count. Safe at 0.8 ONLY
      because effective_bonus_drop_chance_percent is clamp(...,0,100): the drop-count
      ceiling binds before the uplift can compound with the kills/hour term. If that clamp
      is ever removed, peak active throughput grows without a ceiling and the ~3x contract
      breaks. Verified peak total throughput: 2.63x a fully-mastered farm; sustained
      focused play: 1.88x."
    added: 2026-07-14
    revised: ""

